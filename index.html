<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasheel · Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f7;--panel:#fff;--line:rgba(30,45,75,.10);--line2:rgba(30,45,75,.17);
 --ink:#141c2b;--ink2:#3a475e;--muted:#5b6b83;--faint:#8493a8;
 --cyan:#0e9e90;--cyan-d:#0b7d72;--gold:#bd7d12;--gold-d:#9a6410;--violet:#6f5be0;}
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{min-height:100%;background:radial-gradient(1200px 700px at 82% -12%,rgba(14,158,144,.10),transparent 60%),radial-gradient(1000px 600px at -5% 5%,rgba(189,125,18,.09),transparent 55%),var(--bg);
 color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif}
header{padding:22px 30px;display:flex;align-items:center;gap:13px}
.logo{width:40px;height:40px;border-radius:11px;position:relative;background:conic-gradient(from 210deg,var(--cyan),var(--gold),var(--cyan));box-shadow:0 8px 26px -8px rgba(14,158,144,.55)}
.logo::after{content:"";position:absolute;inset:5px;border-radius:7px;background:#fff}
.logo::before{content:"↗";position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-family:'Space Grotesk';font-weight:700;color:var(--cyan);font-size:20px}
.brand .t{font-family:'Space Grotesk';font-weight:700;font-size:18px}
.brand .s{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 26px 60px;max-width:1280px;margin:0 auto;width:100%}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;width:100%}
@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.cards{grid-template-columns:1fr}}

.pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 24px 28px;cursor:pointer;
 text-decoration:none;color:inherit;transition:.22s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 4px rgba(20,30,50,.04),0 18px 40px -24px rgba(20,30,50,.4);overflow:hidden;
 display:flex;flex-direction:column;align-items:center;text-align:center}
.pcard:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 2px 4px rgba(20,30,50,.04),0 30px 60px -26px rgba(20,30,50,.5)}
.pcard .card-icon{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;margin-bottom:18px}
.pcard .card-icon svg{width:40px;height:40px}
.pcard h2{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}

.pcard.pf .card-icon{background:rgba(14,158,144,.12)}
.pcard.pf .card-icon svg{color:#0b7d72}
.pcard.fa .card-icon{background:rgba(111,91,224,.12)}
.pcard.fa .card-icon svg{color:#6f5be0}
.pcard.cc .card-icon{background:rgba(189,125,18,.12)}
.pcard.cc .card-icon svg{color:#9a6410}
.pcard.si .card-icon{background:rgba(217,119,6,.12)}
.pcard.si .card-icon svg{color:#b45309}
.pcard.ac .card-icon{background:rgba(220,38,38,.12)}
.pcard.ac .card-icon svg{color:#991b1b}
.pcard.mj .card-icon{background:rgba(47,158,106,.13)}
.pcard.mj .card-icon svg{color:#1c7d50}
.pcard.hv .card-icon{background:rgba(139,92,246,.12)}
.pcard.hv .card-icon svg{color:#7c3aed}
.pcard.bp .card-icon{background:rgba(59,130,246,.12)}
.pcard.bp .card-icon svg{color:#2563eb}
.pcard.sn .card-icon{background:rgba(13,148,136,.12)}
.pcard.sn .card-icon svg{color:#0f766e}
.pcard.sm .card-icon{background:rgba(219,39,119,.12)}
.pcard.sm .card-icon svg{color:#be185d}

.foot{text-align:center;color:var(--faint);font-size:11px;font-family:'JetBrains Mono';padding:22px}
.foot a{color:var(--cyan-d);text-decoration:none}
</style></head>
