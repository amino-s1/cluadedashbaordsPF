<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasheel · Application Cost</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa;--bg2:#eef1f6;--card:#fff;
  --text:#1a1d2e;--muted:#6b7280;--faint:#d1d5db;
  --border:#e5e7eb;--border2:#d1d5db;
  --accent:#4f46e5;--accent2:#6366f1;--accent-soft:rgba(79,70,229,.08);
  --green:#059669;--green-bg:#ecfdf5;--green-border:#a7f3d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --orange:#d97706;--orange-bg:#fffbeb;--orange-border:#fde68a;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --r:12px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 16px rgba(0,0,0,.07),0 2px 6px rgba(0,0,0,.04)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}

header{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
header .brand{display:flex;align-items:center;gap:12px}
header .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:.03em}
header .t{font-weight:700;font-size:1.05rem;color:var(--text);letter-spacing:-.01em}
header .s{font-size:.7rem;color:var(--muted)}
.spacer{flex:1}
.btn{padding:7px 16px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);transition:all .15s;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.ghost{background:transparent}
.chip{font-size:.7rem;color:var(--muted);padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-family:'JetBrains Mono',monospace;background:var(--bg2)}
.wrap{max-width:1260px;margin:0 auto;padding:24px 28px 80px}

.filter-bar{display:flex;gap:14px;align-items:center;margin-bottom:20px;padding:12px 20px;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);flex-wrap:wrap}
.filter-bar .filter-label{font-size:.66rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px}
.filter-bar label{font-size:.78rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.filter-bar input[type=date]{padding:6px 12px;border:1px solid var(--border);border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:.78rem;background:#fff;color:var(--text);outline:none;transition:border-color .15s}
.filter-bar input[type=date]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filter-bar .reset{font-size:.75rem;color:var(--accent);cursor:pointer;padding:5px 14px;border:1px solid var(--border);border-radius:7px;transition:all .15s;background:#fff;font-weight:600}
.filter-bar .reset:hover{background:var(--accent-soft);border-color:var(--accent)}
.filter-bar .range-info{font-size:.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-left:auto}

.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
@media(max-width:900px){.kpi-strip{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.kpi::before{content:"";position:absolute;top:0;left:0;width:4px;bottom:0;border-radius:4px 0 0 4px}
.kpi.k1::before{background:var(--accent)}
.kpi.k2::before{background:var(--blue)}
.kpi.k3::before{background:var(--green)}
.kpi.k4::before{background:var(--orange)}
.kpi.k5::before{background:var(--red)}
.kpi .label{font-size:.64rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:8px}
.kpi .val{font-family:'DM Sans',sans-serif;font-size:1.55rem;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.kpi .sub{font-size:.7rem;color:var(--muted);margin-top:6px}

.section{margin-bottom:32px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.section-head h2{font-size:1.05rem;font-weight:700;color:var(--text)}
.section-head .badge{font-size:.68rem;font-weight:700;padding:4px 14px;border-radius:20px;letter-spacing:.2px}
.badge.booked{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge.notbooked{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}

.panel{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--border)}
@media(max-width:700px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
.summary-item{text-align:center;padding:20px 16px;border-right:1px solid var(--border)}
.summary-item:last-child{border-right:none}
.summary-item .num{font-family:'DM Sans',sans-serif;font-size:1.3rem;font-weight:700;color:var(--text)}
.summary-item .lbl{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:5px;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:10px 16px;font-size:.62rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);background:var(--bg2)}
td{padding:10px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-soft)}
.right{text-align:right}
.mono{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:#374151}
.totrow td{font-weight:700;border-top:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.note{font-size:.7rem;color:var(--muted);padding:12px 18px;border-top:1px solid var(--border);background:var(--bg2)}

.cost-rates{margin-bottom:24px}
.cost-rates summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);padding:12px 0;transition:color .15s}
.cost-rates summary:hover{color:var(--accent)}
.cost-rates table{margin-top:8px}

.tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:2px solid var(--border);padding:0}
.tab-btn{padding:10px 22px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:inherit}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none}
.tab-pane.active{display:block}

.status-matrix{margin-bottom:20px}
.status-matrix table{width:100%}
.status-matrix th{white-space:nowrap;font-size:.58rem;padding:8px 6px}
.status-matrix th.rotate{writing-mode:vertical-lr;transform:rotate(180deg);text-align:left;height:120px;vertical-align:bottom;padding:6px 4px}
.status-matrix td{padding:6px 8px;text-align:center;white-space:nowrap}
.status-matrix td:first-child{text-align:left;font-weight:600;font-size:.78rem;min-width:220px}
.status-matrix .cnt{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);margin-left:4px}
.status-matrix select{padding:2px 4px;font-size:.72rem;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--text);cursor:pointer;font-family:inherit}
.status-matrix select.yes{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.status-matrix select.no{background:var(--bg2);color:var(--muted)}
.status-matrix tr.parent-row{cursor:pointer}
.status-matrix tr.parent-row td:first-child{position:relative;padding-left:22px}
.status-matrix tr.parent-row td:first-child::before{content:'▶';position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:.55rem;color:var(--muted);transition:transform .15s}
.status-matrix tr.parent-row.open td:first-child::before{transform:translateY(-50%) rotate(90deg)}
.status-matrix tr.sub-row{display:none;background:var(--bg2)}
.status-matrix tr.sub-row.visible{display:table-row}
.status-matrix tr.sub-row td:first-child{padding-left:30px;font-weight:500;font-size:.72rem;color:var(--muted)}
.status-matrix tr.sub-row td{font-size:.72rem}
.status-matrix select:disabled{opacity:.6;cursor:not-allowed;pointer-events:none}

.status-cost-result{margin-top:20px}
</style>
</head><body>

    const line=s.cost*calls;
    grand+=line;
    const note=s.key==='gosi'?' (Private/Pension)':s.key==='mof'?' (Gov/Military)':'';
    html+=`<tr><td>${s.name}${note}</td><td class="right mono">${fmt(s.cost)}</td><td class="right mono">${fmtI(calls)}</td><td class="right mono">${fmt(line)}</td></tr>`;
  });
  if(isBooked){
    const n69=NAFITH.above50k*(nafith69||0);
    const n35=NAFITH.below50k*(nafith35||0);
    grand+=n69+n35;
    html+=`<tr><td>Nafith (≥ 50,000 SAR)</td><td class="right mono">${fmt(NAFITH.above50k)}</td><td class="right mono">${fmtI(nafith69||0)}</td><td class="right mono">${fmt(n69)}</td></tr>`;
    html+=`<tr><td>Nafith (< 50,000 SAR)</td><td class="right mono">${fmt(NAFITH.below50k)}</td><td class="right mono">${fmtI(nafith35||0)}</td><td class="right mono">${fmt(n35)}</td></tr>`;
  }
  html+=`<tr class="totrow"><td colspan="3">Total Cost</td><td class="right mono">${fmt(grand)}</td></tr></tbody></table>`;
  return {html,grand};
}

function calcSegmentCost(count,isLocal,gosiCount,mofCount,nafith69,nafith35){
  let cost=0;
  SERVICES.forEach(s=>{
    if(s.key==='gosi') cost+=s.cost*(gosiCount||0);
    else if(s.key==='mof') cost+=s.cost*(mofCount||0);
    else if(s.expatOnly) cost+=isLocal?0:s.cost*count;
    else if(s.localOnly) cost+=isLocal?s.cost*count:0;
    else cost+=s.cost*count;
  });
  if(nafith69!=null){cost+=NAFITH.above50k*(nafith69||0);cost+=NAFITH.below50k*(nafith35||0);}
  return cost;
}

function calcNotBookedCost(from,to){
  // Use the date-filtered per-status breakdown (statusByDay) when a range is
  // given, same source the Status tab's aggregateStatuses() reads — falls
  // back to the all-time COST_DATA.statuses only when no range is selected.
  let sts=COST_DATA.statuses;
  const sbd=COST_DATA.statusByDay;
  if(sbd&&from&&to){
    const agg={};
    for(const s in MASTER_DEF){
      agg[s]={l:0,e:0,gl:0,ge:0,ml:0,me:0,ln69:0,ln35:0,en69:0,en35:0};
    }
    COST_DATA.dates.forEach(d=>{
      if(d<from||d>to) return;
      const dayMap=sbd[d]; if(!dayMap) return;
      for(const s in dayMap){
        if(!agg[s]) continue;
        const sd=dayMap[s], a=agg[s];
        a.l+=sd.l; a.e+=sd.e; a.gl+=sd.gl; a.ge+=sd.ge; a.ml+=sd.ml; a.me+=sd.me;
        a.ln69+=sd.ln69; a.ln35+=sd.ln35; a.en69+=sd.en69; a.en35+=sd.en35;
      }
    });
    sts=agg;
  }
  if(!sts) return {local:0,expat:0,total:0};
  let lc=0, ec=0;
  for(const s in sts){
    if(BOOKED_STATUSES.has(s)) continue;
    const bits=MASTER_DEF[s]; if(!bits) continue;
    const st=sts[s];
    for(let i=0;i<10;i++){
      if(!bits[i]) continue;
      NB_LOCAL_COSTS[i].forEach(sv=>{lc+=sv.cost*(st[sv.k]||0);});
      NB_EXPAT_COSTS[i].forEach(sv=>{ec+=sv.cost*(st[sv.k]||0);});
    }
  }
  return {local:lc,expat:ec,total:lc+ec};
}

    {id:'simah_l',name:'SIMAH',cost:18.4,cntKey:'l'},
    {id:'qarar_l',name:'Qarar',cost:5.98,cntKey:'l'},
    {id:'yaqeen_local',name:'Yaqeen',cost:3.34,cntKey:'l'},
    {id:'citc_l',name:'CITC',cost:2.3,cntKey:'l'},

  ];

    {id:'gosi_e',name:'GOSI',cost:4.8645,cntKey:'ge'},
    {id:'mof_e',name:'MOF',cost:10.35,cntKey:'me'},
    {id:'simah_e',name:'SIMAH',cost:18.4,cntKey:'e'},
    {id:'qarar_e',name:'Qarar',cost:5.98,cntKey:'e'},
    {id:'yaqeen_expat_legal',name:'Yaqeen Legal',cost:3.45,cntKey:'e'},
    {id:'yaqeen_expat_iqama',name:'Yaqeen Iqama',cost:3.22,cntKey:'e'},
    {id:'citc_e',name:'CITC',cost:2.3,cntKey:'e'},
    {id:'national_address_e',name:'Nat. Address',cost:2.3,cntKey:'e'},
    {id:'sayen_e',name:'Sayen',cost:6.9,cntKey:'e'},
    {id:'emdha_e',name:'Emdha',cost:8.21,cntKey:'e'},
    {id:'nafath_e',name:'Nafath',cost:3.45,cntKey:'e'},
    {id:'nafith_69_e',name:'Nafith ≥50K',cost:69,cntKey:'en69'},
    {id:'nafith_35_e',name:'Nafith <50K',cost:35,cntKey:'en35'},
  ];

  // Map sheet columns to service IDs
  const COL_L=[['gosi_l','mof_l'],['simah_l'],['qarar_l'],['yaqeen_local'],['citc_l'],['national_address_l'],['sayen_l'],['emdha_l'],['nafath_l'],['nafith_69_l','nafith_35_l']];
  const COL_E=[['gosi_e','mof_e'],['simah_e'],['qarar_e'],['yaqeen_expat_legal','yaqeen_expat_iqama'],['citc_e'],['national_address_e'],['sayen_e'],['emdha_e'],['nafath_e'],['nafith_69_e','nafith_35_e']];
  function buildDefaults(status){
    const bits=MASTER_DEF[status]; if(!bits) return {};
    const d={};
    COL_L.forEach((ids,i)=>ids.forEach(id=>{d[id]=bits[i]?'Y':'N';}));
    COL_E.forEach((ids,i)=>ids.forEach(id=>{d[id]=bits[i]?'Y':'N';}));
    return d;
  }

  const LS_KEY='tasheel_status_cost_v4';
  function loadConfig(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return {};}}
  function saveConfig(c){try{localStorage.setItem(LS_KEY,JSON.stringify(c));}catch(e){}}

  const allStatuses=COST_DATA.statuses;
  if(!allStatuses||!Object.keys(allStatuses).length) return;

  const statusNames=Object.keys(MASTER_DEF).filter(s=>allStatuses[s]).sort((a,b)=>(allStatuses[b]?.n||0)-(allStatuses[a]?.n||0));
  const config=loadConfig();
  statusNames.forEach(s=>{
    const defaults=buildDefaults(s);
    if(!config[s]) config[s]={};
    LOCAL_SVCS.concat(EXPAT_SVCS).forEach(sv=>{if(config[s][sv.id]==null) config[s][sv.id]=defaults[sv.id]||'N';});
  });

  // Aggregate status counts within date range
  function aggregateStatuses(from,to){
    const sbd=COST_DATA.statusByDay;
    if(!sbd||!from||!to) return allStatuses; // fallback to totals
    const agg={};
    statusNames.forEach(s=>{agg[s]={n:0,l:0,e:0,gl:0,ge:0,ml:0,me:0,n69:0,n35:0,ln69:0,ln35:0,en69:0,en35:0};});
    COST_DATA.dates.forEach(d=>{
      if(d<from||d>to) return;
      const dayMap=sbd[d]; if(!dayMap) return;
      for(const s in dayMap){
        if(!agg[s]) continue;
        const sd=dayMap[s], a=agg[s];
        a.l+=sd.l; a.e+=sd.e; a.n+=sd.l+sd.e;
        a.gl+=sd.gl; a.ge+=sd.ge; a.ml+=sd.ml; a.me+=sd.me;
        a.ln69+=sd.ln69; a.ln35+=sd.ln35; a.en69+=sd.en69; a.en35+=sd.en35;
        a.n69+=sd.ln69+sd.en69; a.n35+=sd.ln35+sd.en35;
      }
    });
    return agg;
  }

  // Sub-row definitions: GOSI and MOF are MUTUALLY EXCLUSIVE per application.
  // An app calls exactly one based on employer type (Private/Pension→GOSI, Gov/Military→MOF).
  // ownSvcPrefix = the employer service THIS sub-row represents (always Y)
  // oppSvcPrefix = the opposite employer service (always N, locked)
  const SUB_ROWS={
    l:[{label:'GOSI',key:'gosi',cntKey:'gl',ownSvcPrefix:'gosi',oppSvcPrefix:'mof',n69Key:'ln69',n35Key:'ln35'},
       {label:'MOF',key:'mof',cntKey:'ml',ownSvcPrefix:'mof',oppSvcPrefix:'gosi',n69Key:'ln69',n35Key:'ln35'}],
    e:[{label:'GOSI',key:'gosi',cntKey:'ge',ownSvcPrefix:'gosi',oppSvcPrefix:'mof',n69Key:'en69',n35Key:'en35'},
       {label:'MOF',key:'mof',cntKey:'me',ownSvcPrefix:'mof',oppSvcPrefix:'gosi',n69Key:'en69',n35Key:'en35'}]
  };
  // Is this service the sub-row's OWN employer service?
  function isOwnSvc(sv,sub){ return sv.id.startsWith(sub.ownSvcPrefix); }
  // Is this service the OPPOSITE employer service (must be locked N)?
  function isOppSvc(sv,sub){ return sv.id.startsWith(sub.oppSvcPrefix); }
  // Get the effective count for a service in a sub-row.
  // Nafith counts (ln69/ln35/en69/en35) are totals not split by employer type,
  // so we proportion them by the GOSI/MOF ratio.
  function subSvcCount(sv,sub,st){
    if(sv.id.startsWith('nafith_69')||sv.id.startsWith('nafith_35')){
      const nKey=sv.id.startsWith('nafith_69')?sub.n69Key:sub.n35Key;
      const total=st[nKey]||0;
      if(!total) return 0;
      // proportion: this sub-row's employer count / total employer count
      const gosiK=sub.ownSvcPrefix==='gosi'?sub.cntKey: // find the other sub's cntKey
        (sub.cntKey.startsWith('g')?sub.cntKey.replace('g','m'):sub.cntKey.replace('m','g')); // won't happen, use oppKey
      // Simpler: get both employer counts from st
      const isLocal=sub.cntKey.endsWith('l')||sub.cntKey==='gl'||sub.cntKey==='ml';
      const gosiCnt=st[isLocal?'gl':'ge']||0, mofCnt=st[isLocal?'ml':'me']||0;
      const denom=gosiCnt+mofCnt;
      if(!denom) return 0;
      const myShare=st[sub.cntKey]||0;
      return total*myShare/denom;
    }
    // All other services use the sub-row's employer count
    return st[sub.cntKey]||0;
  }

  function buildGroup(title,badge,svcs,countKey,groupClass,statuses){

      // Parent row cost
      let rowCost=0;

        const val=cfg[sv.id]||'N';
        const cls=val==='Y'?'yes':'no';
        html+=`<td><select class="${cls}" data-status="${s}" data-svc="${sv.id}"><option value="Y"${val==='Y'?' selected':''}>Yes</option><option value="N"${val==='N'?' selected':''}>No</option></select></td>`;
      });
      html+=`<td class="right mono">${fmt(costPerApp)}</td><td class="right mono" style="font-weight:600">${fmt(rowCost)}</td></tr>`;
      // Sub-rows for GOSI / MOF (mutually exclusive)
      subs.forEach(sub=>{
        const subCount=st[sub.cntKey]||0;
        const subCfgKey=s+'__'+sub.key;
        if(!config[subCfgKey]){
          config[subCfgKey]={};
          svcs.forEach(sv=>{
            if(isOwnSvc(sv,sub)) config[subCfgKey][sv.id]=cfg[sv.id]||'N'; // inherit parent's own svc (locked)
            else if(isOppSvc(sv,sub)) config[subCfgKey][sv.id]='N';         // opposite always N (locked)
            else config[subCfgKey][sv.id]=cfg[sv.id]||'N';                  // inherit parent for rest
          });
        }
        // Always sync locked values from parent (enforce mutual exclusivity)
        svcs.forEach(sv=>{
          if(isOwnSvc(sv,sub)) config[subCfgKey][sv.id]=cfg[sv.id]||'N';
          else if(isOppSvc(sv,sub)) config[subCfgKey][sv.id]='N';
        });
        const scfg=config[subCfgKey];
        let subCost=0;
        svcs.forEach(sv=>{
          if(scfg[sv.id]==='Y') subCost+=sv.cost*subSvcCount(sv,sub,st);
        });
        const subCpa=subCount?subCost/subCount:0;
        html+=`<tr class="sub-row" data-parent="${pid}"><td>↳ ${sub.label}</td><td class="right mono">${fmtI(subCount)}</td>`;
        svcs.forEach(sv=>{
          const val=scfg[sv.id]||'N';
          const cls=val==='Y'?'yes':'no';
          const locked=isOwnSvc(sv,sub)||isOppSvc(sv,sub);
          if(locked){
            // Locked: show value but disable interaction
            html+=`<td><select class="${cls}" disabled data-status="${subCfgKey}" data-svc="${sv.id}"><option value="${val}">${val==='Y'?'Yes':'No'}</option></select></td>`;
          } else {
            html+=`<td><select class="${cls}" data-status="${subCfgKey}" data-svc="${sv.id}"><option value="Y"${val==='Y'?' selected':''}>Yes</option><option value="N"${val==='N'?' selected':''}>No</option></select></td>`;
          }
        });
        html+=`<td class="right mono">${fmt(subCpa)}</td><td class="right mono" style="font-weight:600">${fmt(subCost)}</td></tr>`;
      });
    });
    html+=`<tr class="totrow"><td colspan="2">Subtotal</td><td colspan="${svcs.length+1}"></td><td class="right mono">${fmt(groupTotal)}</td></tr>`;
    html+='</tbody></table></div></div>';
    return {html,total:groupTotal};
  }

  let sFrom=null, sTo=null;
  function renderStatuses(){
    const statuses=aggregateStatuses(sFrom,sTo);
    const localG=buildGroup('Local (Saudi)','CivilID starts with 1',LOCAL_SVCS,'l','booked',statuses);
    const expatG=buildGroup('Expat','CivilID starts with 2',EXPAT_SVCS,'e','notbooked',statuses);
    const grand=localG.total+expatG.total;
    const totalApps=statusNames.reduce((a,s)=>a+(statuses[s]?.n||0),0);
    const rangeLabel=sFrom&&sTo?`${sFrom} → ${sTo} · ${fmtI(totalApps)} apps`:`All dates · ${fmtI(totalApps)} apps`;
    document.getElementById('s-range-info').textContent=rangeLabel;
    let html=localG.html+expatG.html;
    html+=`<div class="kpi-strip" style="grid-template-columns:repeat(3,1fr);margin-top:8px">
      <div class="kpi k2"><div class="label">Local Cost</div><div class="val">SAR ${fmt(localG.total)}</div></div>
      <div class="kpi k3"><div class="label">Expat Cost</div><div class="val">SAR ${fmt(expatG.total)}</div></div>
      <div class="kpi k1"><div class="label">Total Estimated Cost</div><div class="val">SAR ${fmt(grand)}</div><div class="sub">${fmtI(totalApps)} applications</div></div>
    </div>`;
    document.getElementById('status-content').innerHTML=html;
    // Expand/collapse parent rows
    document.querySelectorAll('.status-matrix tr.parent-row').forEach(pr=>{
      pr.addEventListener('click',e=>{
        if(e.target.tagName==='SELECT'||e.target.tagName==='OPTION') return;
        const pid=pr.dataset.pid;
        pr.classList.toggle('open');
        document.querySelectorAll(`.sub-row[data-parent="${pid}"]`).forEach(sr=>sr.classList.toggle('visible'));
      });
    });
    // Yes/No selects for both parent and sub rows
    document.querySelectorAll('.status-matrix select').forEach(sel=>{
      sel.addEventListener('change',()=>{
        const s=sel.dataset.status, sv=sel.dataset.svc;
        if(!config[s]) config[s]={};
        config[s][sv]=sel.value;
        sel.className=sel.value==='Y'?'yes':'no';
        saveConfig(config);
        renderStatuses();
      });
    });
  }

  // Wire up status filter
  const sfBar=document.getElementById('status-filter-bar');
  sfBar.style.display='flex';
  const sfFrom=document.getElementById('s-date-from');
  const sfTo=document.getElementById('s-date-to');
  // Default: yesterday only.
  const yd2=new Date();yd2.setDate(yd2.getDate()-1);const yds2=yd2.toISOString().slice(0,10);
  const defaultDayTo=yds2<M.min?M.min:yds2>M.max?M.max:yds2;
  const defaultDayFrom=defaultDayTo;
  sfFrom.min=M.min; sfFrom.max=M.max;
  sfTo.min=M.min; sfTo.max=M.max;
  sfFrom.value=defaultDayFrom; sfTo.value=defaultDayTo;
  sFrom=defaultDayFrom; sTo=defaultDayTo;
  sfFrom.addEventListener('change',()=>{sFrom=sfFrom.value;renderStatuses();});
  sfTo.addEventListener('change',()=>{sTo=sfTo.value;renderStatuses();});
  document.getElementById('s-reset-btn').addEventListener('click',()=>{
    sfFrom.value=M.min; sfTo.value=M.max; sFrom=M.min; sTo=M.max; renderStatuses();
  });

  renderStatuses();
})();
</script>
</body></html>
